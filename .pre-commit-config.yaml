repos:
  - repo: local
    hooks:
      
      - id: ruff
        name: ruff
        entry: poetry run ruff check --fix
        language: system
        types: [python]

      
      - id: ruff-format
        name: ruff-format
        entry: poetry run ruff format
        language: system
        types: [python]

      
      - id: ty-check
        name: ty-check
        
        entry: poetry run ty check
        language: system
        types: [python]
        pass_filenames: false
